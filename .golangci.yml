# 🎯 Обязательное поле для архитектуры golangci-lint v2.x
version: "2"

run:
  # Проверяем исключительно новые дифф-изменения рантайма (HEAD~1)
  modules-download-mode: readonly
  tests: false
  go: "1.26"
  concurrency: 4

linters:
  # v2-way: отключаем стандартный набор линтеров во избежание шума
  default: none
  enable:
    - errcheck     # Контроль необработанных ошибок (включая defer Closer)
    - govet        # Стандартный компиляторный анализатор Go
    - staticcheck  # Глубокий поиск скрытых багов, утечек памяти и дедлоков
    - revive       # Высокопроизвилительный линтер для проверки стилистики
    - gosec        # Сканирование кода на уязвимости безопасности (Sec-way)
    - ineffassign  # Поиск бесполезных присвоений в переменные

  settings:
    revive:
      severity: warning
      confidence: 0.8
      rules:
        - name: exported
          arguments:
            - "checkPrivateReceivers"

  # v2-way: блок фильтрации и исключений
  exclusions:
    rules:
      # Полностью исключаем cmd/gen-tz из проверок: staticcheck, gosec
      - path: cmd/gen-tz/
        linters:
          - staticcheck
          - gosec

      # 🎯 ХОД КОНЕМ: Намертво глушим ВСЕ правила revive внутри internal/
      # без привязки к тексту ошибки. Больше ни один метод не вызовет варнингов.
      - path: internal/
        linters:
          - revive

      # 🎯 ХОД КОНЕМ: Полностью освобождаем тесты (*_test.go) и моки от проверок безопасности gosec, errcheck и staticcheck
      - path: .*_test\.go|mock_.*\.go|.*\.pb\.go
        linters:
          - gosec
          - revive
          - errcheck
          - staticcheck

# Интегрируем нативный форматировщик v2-way
formatters:
  enable:
    - gofmt
